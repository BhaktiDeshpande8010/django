<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    {% include 'nav.html'%}
    <h1>Updation Form</h1>

    <form action="/profileupdate/" method="POST">
        {% csrf_token %}
        <input type="hidden" name="id" placeholder="Enter Your Name" value="{{i.id}} ">

        <input type="text" name="name" placeholder="Enter Your Name" value="{{i.name}}">
        <br><br>
        <input type="email" name="email" placeholder="Enter Your Email" value="{{i.email}}">
        <br><br>
        <input type="password" name="password" placeholder="Enter Your Password" value="{{i.password}}">
        <br><br>
        <input type="tel" name="contact" placeholder="Enter Your Contact" value="{{i.contact}}">
        <br><br>
        <input type="text" name="address" placeholder="Enter Your City" value="{{i.address}}">
        <br><br>
        <input class="btn btn-primary" type="submit">
    </form>

</body>

</html>
