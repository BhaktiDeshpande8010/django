<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    {% include "nav.html" %}
    <h1>Registrated Student</h1>

    <table class="table table-striped">
        <tr>
            <th>tD</th>
            <th>Fullname</th>
            <th>Email</th>
            <th>Contact</th>
            <th>Password</th>
            <th>Address</th>
            <th>Action</th>
                
        </tr>

        {% for i in data %}
        <tr>
            <td>{{i.id}}</td>
            <td>{{i.name}}</td>
            <td>{{i.email}}</td>
            <td>{{i.password}}</td>
            <td>{{i.contact}}</td>
            <td>{{i.address}}</td>
            <td>
                <a href="deletestudent/{{i.id}}" class="btn btn-danger">Delete</a>
                <a href="deletestudent/{{i.id}}" class="btn btn-success">Update</a>

            </td>
        </tr>
        {%endfor%}
    </table>

</body>

</html>
